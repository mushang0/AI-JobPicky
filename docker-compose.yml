services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobpicky
      POSTGRES_PASSWORD: jobpicky
      POSTGRES_DB: jobpicky
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpicky -d jobpicky"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
