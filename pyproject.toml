[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-jobpicky"
version = "0.1.0"
description = "Traceable job aggregation and explainable recommendation backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "langchain-core>=0.3,<1",
    "langchain-huggingface>=0.1,<1",
    "langchain-openai>=0.3,<1",
    "openpyxl>=3.1,<4",
    "pgvector>=0.3,<1",
    "pillow>=10,<13",
    "pydantic>=2.10,<3",
    "pypdfium2>=5,<6",
    "PyJWT>=2.10,<3",
    "python-multipart>=0.0.18,<1",
    "sentence-transformers>=3,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobpicky = ["py.typed", "infrastructure/prompts/*.txt", "infrastructure/schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
follow_imports_for_stubs = true
no_implicit_optional = true
pretty = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
