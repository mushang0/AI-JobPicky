name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobpicky
          POSTGRES_PASSWORD: jobpicky
          POSTGRES_DB: jobpicky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpicky -d jobpicky"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      JOBPICKY_DATABASE_URL: postgresql+asyncpg://jobpicky:jobpicky@localhost:5432/jobpicky
      JOBPICKY_TEST_DATABASE_URL: postgresql+asyncpg://jobpicky:jobpicky@localhost:5432/jobpicky
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run alembic upgrade head
      - run: uv run pytest
